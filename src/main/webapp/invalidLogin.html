<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invalid Login</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Arial, sans-serif;
        padding: 15px;
    }

    .login-box {
        width: 100%;
        max-width: 400px;
        padding: 35px 30px;
        background-color: #000000;
        border: 2px solid #0A58FF;
        border-radius: 18px;
        box-shadow: 0 0 25px rgba(10, 88, 255, 0.5);
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 26px;
        color: #FFD700;
        text-shadow:
            0 0 8px rgba(255, 215, 0, 0.6),
            0 0 15px rgba(10, 88, 255, 0.6);
    }

    /* WARNING MESSAGE */
    .warning {
        background-color: #000000;
        border: 2px solid #DC2626;
        color: #DC2626;
        padding: 12px;
        border-radius: 10px;
        text-align: center;
        margin-bottom: 22px;
        font-weight: 600;
        letter-spacing: 0.4px;
        box-shadow: 0 0 12px rgba(220, 38, 38, 0.6);
        font-size: 14px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        color: #FFD700;
        font-size: 14px;
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        background-color: #000000;
        border: 2px solid #0A58FF;
        border-radius: 10px;
        color: #ffffff;
        font-size: 14px;
        box-shadow: 0 0 12px rgba(10, 88, 255, 0.4);
    }

    input::placeholder {
        color: #9ca3af;
    }

    input:focus {
        outline: none;
        border-color: #FFD700;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    button {
        width: 100%;
        padding: 14px;
        background-color: transparent;
        border: 2px solid #0A58FF;
        color: #FFD700;
        font-size: 16px;
        font-weight: 600;
        border-radius: 30px;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: 0.3s ease;
        box-shadow: 0 0 14px rgba(10, 88, 255, 0.6);
    }

    button:hover {
        background-color: #0A58FF;
        color: #ffffff;
        transform: scale(1.05);
    }

    /* 📱 Mobile */
    @media (max-width: 480px) {
        .login-box {
            padding: 28px 22px;
        }

        h2 {
            font-size: 22px;
        }

        .warning {
            font-size: 13px;
        }

        input {
            padding: 11px;
            font-size: 13px;
        }

        button {
            font-size: 15px;
            padding: 12px;
        }
    }
</style>

</head>

<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <div class="warning">
        ⚠ Invalid login credentials
    </div>

    <form action="login" method="post">
        <label>Mobile Number</label>
        <input type="text" name="username" placeholder="Enter mobile number" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
