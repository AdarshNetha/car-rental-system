<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Cars</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: "Poppins", sans-serif;
        background: #000;
        color: #f1c40f;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    h1 {
        font-size: 44px;
        margin-bottom: 35px;
        text-shadow: 0 0 10px #0a4dff;
    }

    .btn {
        width: 320px;
        max-width: 90%;
        padding: 14px;
        margin: 12px 0;
        font-size: 22px;
        text-decoration: none;
        color: #f1c40f;
        border: 2px solid #0a4dff;
        border-radius: 50px;
        background: transparent;
        cursor: pointer;
        transition: 0.3s ease-in-out;
        display: inline-block;
    }

    .btn:hover {
        background: #0a4dff;
        color: #fff;
        box-shadow: 0 0 15px #0a4dff;
    }

    /* 📱 Mobile */
    @media (max-width: 480px) {
        h1 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .btn {
            font-size: 18px;
            padding: 12px;
        }
    }

    /* 📱 Tablet */
    @media (min-width: 481px) and (max-width: 768px) {
        h1 {
            font-size: 34px;
        }

        .btn {
            font-size: 20px;
        }
    }
</style>
  
</head>
<body>

    <h1>Welcome to Cars</h1>
	<form action="profile" method="post">
		<button type="submit"  class="btn">Admin</button>
	</form>
    <a href="customer.html" class="btn">Customer</a>

</body>
</html>
