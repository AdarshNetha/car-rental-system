<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insert title here</title>
<style type="text/css">
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 15px;
        font-family: "Poppins", sans-serif;
        background: #000;
        color: #f1c40f;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 25px;
        text-align: center;
    }

    h1 {
        font-size: 36px;
        text-shadow: 0 0 10px #0a4dff;
    }

    button {
        width: 300px;
        max-width: 90%;
        padding: 14px;
        font-size: 20px;
        color: #f1c40f;
        border: 2px solid #0a4dff;
        border-radius: 50px;
        background: transparent;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #0a4dff;
        color: #fff;
        box-shadow: 0 0 15px #0a4dff;
    }

    /* 📱 Mobile */
    @media (max-width: 480px) {
        h1 {
            font-size: 26px;
        }

        button {
            font-size: 16px;
            padding: 12px;
        }
    }

    /* 📱 Tablet */
    @media (min-width: 481px) and (max-width: 768px) {
        h1 {
            font-size: 30px;
        }
    }
</style>

</head>
<body>
	<h1>Welcome To Customer Page</h1>
	
	<form action="customerservice">
	<button type="submit">List All Available Cars</button>
	</form>
</body>
</html>
