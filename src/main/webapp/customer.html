<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Page</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #000000;
        font-family: "Poppins", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    /* Card */
    .container {
        width: 100%;
        max-width: 360px;
        background: #0e0e0e;
        border: 1px solid #1e40af;
        border-radius: 18px;
        padding: 32px 22px;
        text-align: center;
        box-shadow:
            0 0 14px rgba(30, 64, 175, 0.45),
            0 0 10px rgba(250, 204, 21, 0.25);
    }

    h1 {
        margin: 0 0 28px;
        font-size: 26px;
        color: #facc15;
        font-weight: 600;
        line-height: 1.3;
        text-shadow: 0 0 6px rgba(250, 204, 21, 0.6);
    }

    button {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        color: #ffffff;
        background: transparent;
        border: 2px solid #1e40af;
        border-radius: 30px;
        cursor: pointer;
        transition: 0.3s ease;
        box-shadow: 0 0 10px rgba(30, 64, 175, 0.4);
    }

    button:hover {
        background: #1e40af;
        color: #ffffff;
        box-shadow:
            0 0 16px rgba(30, 64, 175, 0.9),
            0 0 12px rgba(250, 204, 21, 0.5);
    }

    /* 📱 Small phones */
    @media (max-width: 360px) {
        h1 {
            font-size: 22px;
        }

        button {
            font-size: 15px;
            padding: 12px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1>Welcome to Customer Page</h1>

    <form action="customerservice">
        <button type="submit">List Available Cars</button>
    </form>
</div>

</body>
</html>
