<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Page</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 15px;
        font-family: "Poppins", sans-serif;
        background: #000;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Card container */
    .container {
        width: 100%;
        max-width: 360px;
        background: #000;
        border-radius: 20px;
        padding: 35px 25px;
        text-align: center;
        box-shadow:
            0 0 20px rgba(10, 77, 255, 0.6),
            0 0 25px rgba(250, 204, 21, 0.35);
    }

    h1 {
        margin-bottom: 30px;
        font-size: 26px;
        color: #f1c40f;
        font-weight: 600;
        text-shadow:
            0 0 8px #0a4dff,
            0 0 14px rgba(250, 204, 21, 0.8);
    }

    button {
        width: 100%;
        padding: 14px;
        font-size: 18px;
        font-weight: 600;
        color: #f1c40f;
        background: transparent;
        border: 2px solid #0a4dff;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 0 12px rgba(10, 77, 255, 0.7);
    }

    button:hover {
        background: #0a4dff;
        color: #ffffff;
        box-shadow:
            0 0 18px rgba(10, 77, 255, 1),
            0 0 20px rgba(250, 204, 21, 0.9);
        transform: scale(1.03);
    }

    /* Small screens */
    @media (max-width: 360px) {
        h1 {
            font-size: 22px;
        }
        button {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">
    <h1>Welcome to Customer</h1>

    <form action="customerservice">
        <button type="submit">List Available Cars</button>
    </form>
</div>

</body>
</html>
